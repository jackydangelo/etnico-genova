<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etnico Genova</title>
<meta name="description" content="Mappa dei ristoranti etnici di Genova.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header>
  <div class="titolo">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <rect x=".5" y=".5" width="23" height="23" fill="#fff" stroke="#26343b"/>
      <path d="M10 0h4v10h10v4H14v10h-4V14H0v-4h10z" fill="#c8102e"/>
    </svg>
    <h1>Etnico Genova</h1>
    <button id="conteggio" type="button"></button>
  </div>
  <button id="apriFiltri" type="button" aria-haspopup="dialog">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 5h18l-7 8v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <span>Filtri</span><b id="statoFiltri"></b>
  </button>
</header>
<div id="mappa" role="application" aria-label="Mappa dei ristoranti etnici di Genova"></div>
<dialog id="elenco">
  <div class="testa">
    <h2>Ristoranti</h2>
    <button type="button" id="chiudi" aria-label="Chiudi">✕</button>
  </div>
  <ol id="righe"></ol>
</dialog>
<dialog id="pannelloFiltri" aria-label="Filtri per cucina">
  <div class="testa">
    <h2>Filtri</h2>
    <button type="button" id="chiudiFiltri" aria-label="Chiudi">✕</button>
  </div>
  <ul id="voci"></ul>
</dialog>
<footer>
  Il sito è in continuo aggiornamento. Per contribuire, vai sul
  <a href="https://github.com/jackydangelo/etnico-genova/blob/main/contributing.md" target="_blank" rel="noopener">repository GitHub</a>.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="app.js?v=1"></script>
</body>
</html>
