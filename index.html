<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etnico Genova</title>
<meta name="description" content="Mappa dei ristoranti etnici di Genova.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ardesia: #26343b;
    --rosso: #c8102e;
    --mare: #3c7a8c;
    --carta: #f6f7f7;
    --linea: #d9dfe1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100dvh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ardesia);
    background: var(--carta);
  }
  header {
    padding: 12px 16px 10px;
    background: #fff;
    border-bottom: 1px solid var(--linea);
  }
  .titolo { display: flex; align-items: center; gap: 10px; }
  .titolo svg { flex: none; }
  h1 { margin: 0; font-size: 1.25rem; letter-spacing: -0.01em; }
  #conteggio {
    margin-left: auto; padding: 4px 0; border: 0; background: none;
    font: inherit; font-size: .85rem; color: var(--mare);
    text-decoration: underline; cursor: pointer;
  }
  dialog {
    width: min(92vw, 480px); max-height: 80dvh; padding: 0;
    border: 1px solid var(--linea); border-radius: 8px; color: var(--ardesia);
  }
  dialog::backdrop { background: rgba(38, 52, 59, .45); }
  .testa {
    position: sticky; top: 0; display: flex; align-items: center;
    justify-content: space-between; padding: 12px 16px;
    background: #fff; border-bottom: 1px solid var(--linea);
  }
  .testa h2 { margin: 0; font-size: 1rem; }
  #chiudi, #chiudiFiltri { border: 0; background: none; font-size: 1.1rem; color: inherit; cursor: pointer; padding: 4px 8px; }
  #righe { list-style: none; margin: 0; padding: 0; }
  #righe li { border-bottom: 1px solid var(--linea); }
  #righe li:last-child { border-bottom: 0; }
  #righe li > button {
    display: block; width: 100%; text-align: left; padding: 10px 16px;
    border: 0; background: none; font: inherit; color: inherit; cursor: pointer;
  }
  #righe span { display: block; font-size: .85rem; }
  #righe button span:first-of-type { color: var(--mare); }
  .vuoto { padding: 12px 16px; font-size: .9rem; }
  #apriFiltri {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--linea); background: #fff;
    font: inherit; font-size: .9rem; color: inherit; cursor: pointer;
  }
  #apriFiltri b { color: var(--mare); font-weight: 600; }
  #apriFiltri:focus-visible, .leaflet-marker-icon:focus-visible, .voce:focus-visible,
  #conteggio:focus-visible,
  #righe li > button:focus-visible { outline: 3px solid var(--rosso); outline-offset: 2px; }
  #chiudi, #chiudi:focus, #chiudi:focus-visible,
  #chiudiFiltri, #chiudiFiltri:focus, #chiudiFiltri:focus-visible { outline: none; }

  #voci { list-style: none; margin: 0; padding: 0; }
  #voci li { border-bottom: 1px solid var(--linea); }
  #voci li:last-child { border-bottom: 0; }
  #voci li:first-child { background: var(--carta); }
  .voce {
    display: flex; align-items: center; gap: 12px;
    width: 100%; min-height: 52px; padding: 8px 16px;
    border: 0; background: none; font: inherit; color: inherit;
    text-align: left; cursor: pointer;
  }
  .voce i { flex: none; width: 12px; height: 12px; border-radius: 50%; }
  .voce .nome { flex: 1; }
  .voce[data-id="tutto"] .nome { font-weight: 600; }
  .voce small { color: var(--mare); font-size: .85rem; }
  .sw {
    position: relative; flex: none; width: 40px; height: 24px;
    border-radius: 999px; background: var(--linea); transition: background .15s;
  }
  .sw::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
  }
  .voce[aria-checked="true"] .sw { background: var(--ardesia); }
  .voce[aria-checked="true"] .sw::after { transform: translateX(16px); }
  @media (prefers-reduced-motion: reduce) { .sw, .sw::after { transition: none; } }
  footer {
    padding: 8px 16px;
    background: #fff;
    border-top: 1px solid var(--linea);
    font-size: .8rem;
    text-align: center;
  }
  footer a { color: var(--mare); }
  footer a:focus-visible { outline: 3px solid var(--rosso); outline-offset: 2px; }
  #mappa { width: 100%; height: 100%; }
  .pin {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--c); color: #fff;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  .popup h2 { margin: 0 0 2px; font-size: 1rem; }
  .popup p { margin: 2px 0; font-size: .85rem; }
  .popup .cucina { color: var(--mare); font-weight: 600; }
  #errore { padding: 12px 16px; background: #fdecee; color: var(--rosso); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <div class="titolo">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <rect x=".5" y=".5" width="23" height="23" fill="#fff" stroke="#26343b"/>
      <path d="M10 0h4v10h10v4H14v10h-4V14H0v-4h10z" fill="#c8102e"/>
    </svg>
    <h1>Etnico Genova</h1>
    <button id="conteggio" type="button"></button>
  </div>
  <button id="apriFiltri" type="button" aria-haspopup="dialog">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 5h18l-7 8v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <span>Filtri</span><b id="statoFiltri"></b>
  </button>
</header>
<div id="mappa" role="application" aria-label="Mappa dei ristoranti etnici di Genova"></div>
<dialog id="elenco">
  <div class="testa">
    <h2>Ristoranti</h2>
    <button type="button" id="chiudi" aria-label="Chiudi">✕</button>
  </div>
  <ol id="righe"></ol>
</dialog>
<dialog id="pannelloFiltri" aria-label="Filtri per cucina">
  <div class="testa">
    <h2>Filtri</h2>
    <button type="button" id="chiudiFiltri" aria-label="Chiudi">✕</button>
  </div>
  <ul id="voci"></ul>
</dialog>
<footer>
  Il sito è in continuo aggiornamento. Per contribuire, vai sul
  <a href="https://github.com/jackydangelo/etnico-genova" target="_blank" rel="noopener">repository GitHub</a>.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const colore = cucina => {
  let h = 0;
  for (const ch of cucina) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h}, 55%, 40%)`;
};

const mappa = L.map("mappa", { zoomControl: true }).setView([44.4056, 8.9463], 13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(mappa);

const gruppo = L.layerGroup().addTo(mappa);
let ristoranti = [];
const attive = new Set();

let visibili = [];
function disegna() {
  gruppo.clearLayers();
  visibili = ristoranti.filter(r => attive.has(r.cucina));
  visibili.forEach(r => {
    const icona = L.divIcon({
      className: "",
      html: `<div class="pin" style="--c:${colore(r.cucina)}"></div>`,
      iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
    });
    const sito = r.sito ? `<p><a href="${esc(r.sito)}" target="_blank" rel="noopener">Sito web</a></p>` : "";
    r.marker = L.marker([r.lat, r.lng], { icon: icona, title: r.nome })
      .bindPopup(`<div class="popup"><h2>${esc(r.nome)}</h2>
        <p class="cucina">${esc(r.cucina)}</p>
        <p>${esc(r.indirizzo)}</p>
        ${r.note ? `<p>${esc(r.note)}</p>` : ""}${sito}</div>`)
      .addTo(gruppo);
  });
  document.getElementById("conteggio").textContent =
    visibili.length === 1 ? "1 ristorante" : `${visibili.length} ristoranti`;
}

function filtri() {
  const cucine = [...new Set(ristoranti.map(r => r.cucina))]
    .sort((a, b) => a.localeCompare(b, "it"));
  cucine.forEach(c => attive.add(c));

  const pannello = document.getElementById("pannelloFiltri");
  const voci = document.getElementById("voci");
  const stato = document.getElementById("statoFiltri");

  const voce = (id, nome, col, n) => `<li>
    <button type="button" class="voce" role="switch" data-id="${id}">
      <i style="background:${col}"></i><span class="nome">${esc(nome)}</span>
      <small>${n}</small><span class="sw"></span>
    </button></li>`;

  voci.innerHTML = voce("tutto", "Tutto", "transparent", ristoranti.length)
    + cucine.map((c, i) =>
        voce(i, c, colore(c), ristoranti.filter(r => r.cucina === c).length)).join("");

  const aggiorna = () => {
    voci.querySelectorAll(".voce").forEach(b => {
      const acceso = b.dataset.id === "tutto"
        ? attive.size === cucine.length
        : attive.has(cucine[b.dataset.id]);
      b.setAttribute("aria-checked", acceso);
    });
    stato.textContent = `${attive.size}/${cucine.length}`;
    disegna();
  };

  voci.onclick = e => {
    const b = e.target.closest(".voce");
    if (!b) return;
    if (b.dataset.id === "tutto") {
      if (attive.size === cucine.length) attive.clear();
      else cucine.forEach(c => attive.add(c));
    } else {
      const c = cucine[b.dataset.id];
      attive.has(c) ? attive.delete(c) : attive.add(c);
    }
    aggiorna();
  };

  document.getElementById("apriFiltri").onclick = () => pannello.showModal();
  document.getElementById("chiudiFiltri").onclick = () => pannello.close();
  pannello.addEventListener("click", e => { if (e.target === pannello) pannello.close(); });
  aggiorna();
}

const elenco = document.getElementById("elenco");
const righe = document.getElementById("righe");
let ordinati = [];

document.getElementById("conteggio").onclick = () => {
  ordinati = [...visibili].sort((a, b) => a.nome.localeCompare(b.nome, "it"));
  righe.innerHTML = ordinati.length
    ? ordinati.map((r, i) => `<li><button type="button" data-i="${i}">
        <strong>${esc(r.nome)}</strong><span>${esc(r.cucina)}</span><span>${esc(r.indirizzo)}</span>
      </button></li>`).join("")
    : '<li class="vuoto">Nessuna cucina selezionata.</li>';
  elenco.showModal();
};
righe.onclick = e => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const r = ordinati[b.dataset.i];
  elenco.close();
  mappa.setView([r.lat, r.lng], 16);
  r.marker.openPopup();
};
document.getElementById("chiudi").onclick = () => elenco.close();
elenco.addEventListener("click", e => { if (e.target === elenco) elenco.close(); });

fetch("ristoranti.yaml")
  .then(r => { if (!r.ok) throw new Error("ristoranti.yaml non trovato"); return r.text(); })
  .then(testo => {
    const dati = jsyaml.load(testo) || [];
    const senza = dati.filter(r => typeof r.lat !== "number" || typeof r.lng !== "number");
    senza.forEach(r => console.warn("Senza coordinate, non mostrato:", r.nome));
    ristoranti = dati.filter(r => !senza.includes(r));
    filtri();
    if (ristoranti.length > 1)
      mappa.fitBounds(ristoranti.map(r => [r.lat, r.lng]), { padding: [40, 40], maxZoom: 15 });
  })
  .catch(e => {
    const d = document.createElement("div");
    d.id = "errore";
    d.textContent = "Impossibile caricare i ristoranti: " + e.message;
    document.querySelector("header").after(d);
  });
</script>
</body>
</html>
